# Alembic configuration.
#
# The database URL is deliberately empty here and supplied at runtime from
# validated settings, so a credential never reaches a tracked file. See
# migrations/env.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[post_write_hooks]

# Logging. SQLAlchemy is quiet by default because migrations emit the statements
# that matter through Alembic's own logger; raise it to INFO to see the SQL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
