name: arbiter

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: arbiter
      POSTGRES_DB: arbiter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Dependent services must wait for readiness, not just for the container
      # to exist, or the first migration races the database.
      test: ["CMD-SHELL", "pg_isready -U arbiter -d arbiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://arbiter:arbiter@postgres:5432/arbiter
    command: ["check"]

volumes:
  pgdata:
